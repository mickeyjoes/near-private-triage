# Read-only guided demo on GitHub Pages (source: GitHub Actions). Deploys ONLY the
# static web/dist build: recorded genuine evidence, no backend, no API key, no live
# inference (with no /api the app stays in guided-demo mode). Runs on every push to
# main, after the full typecheck and test suite, and on manual dispatch.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_STATIC_DEMO: '1' # static guided demo: the app never contacts an API
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
